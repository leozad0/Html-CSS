<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>

    <style>
        h1, h2{
            font-family: Arial, Helvetica, sans-serif;
            text-shadow: 1px 1px rgba(0, 0, 0, 0.416);
            text-align: center;
            margin-bottom: 40px;
        }

         div.conteiner{
            background-color: lightsalmon;
            display: flex;
            border-radius: 20px;
            flex-flow: row nowrap;
            justify-content: center;
            align-content: center;
            width: 90vw;
            margin: auto;
         }

         div.item{
            background-color: lightblue;
            border: 1.5px solid black;
            flex-basis: 200px;
            border-radius: 10px;
            margin: 10px;
            text-align: center;
            padding: 20px;
         }

         div#cxa{
            flex-shrink: 1;
            flex-grow: 0;
         }

         div#cxb{
            flex-shrink: 0;
            flex-grow: 2;
         }

         div#cxc{
            flex-shrink: 2;
            flex-grow: 1;
         }
    </style>

</head>
<body>
    <h1>Flexbox</h1>

    <h2>Aprendendo a usar e aplicar flexbox</h2>

    <div class="conteiner">
        <div class="item" id="cxa"><h1>A</h1></div>
        <div class="item" id="cxb"><h1>B</h1></div>
        <div class="item" id="cxc"><h1>C</h1></div>
    </div>
</body>
</html>
